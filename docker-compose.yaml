services:
  beacon:
    build:
      context: .
      dockerfile: Dockerfile
    image: beacon:latest
    container_name: beacon
    volumes:
      - ./data:/app/data
    environment:
      - BASE_URL=https://${DOMAIN:?DOMAIN is not set}
      - DATA_PATH=/app/data/registry.json
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 64M
